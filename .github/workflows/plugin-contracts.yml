name: Plugin contracts

on:
  push:
    paths:
      - ".claude-plugin/**"
      - "plugins/dotnet-nudge/**"
      - "tests/plugin-contracts/**"
      - "scripts/release-runtime.py"
      - "docs/plugin-development.md"
      - "README.md"
      - ".github/workflows/plugin-contracts.yml"
      - ".github/extensions/**"
  pull_request:
    paths:
      - ".claude-plugin/**"
      - "plugins/dotnet-nudge/**"
      - "tests/plugin-contracts/**"
      - "scripts/release-runtime.py"
      - "docs/plugin-development.md"
      - "README.md"
      - ".github/workflows/plugin-contracts.yml"
      - ".github/extensions/**"
  workflow_dispatch:

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run offline plugin contract tests
        run: python -m unittest discover -s tests/plugin-contracts -v
      - name: Run offline runtime bootstrap tests
        run: node --test tests/plugin-contracts/runtime.test.cjs
      - name: Run dashboard and optional native hook contracts
        run: node --test tests/plugin-contracts/dashboard.test.mjs tests/plugin-contracts/copilot-hooks.test.mjs
