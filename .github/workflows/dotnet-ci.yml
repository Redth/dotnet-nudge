name: .NET foundation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test-publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            executable: dotnet-nudge
          - os: macos-latest
            rid: osx-x64
            executable: dotnet-nudge
          - os: windows-latest
            rid: win-x64
            executable: dotnet-nudge.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build
        run: dotnet build DotnetNudge.sln --configuration Release
      - name: Test
        env:
          NUDGE_INTEGRATION_TEST_ROOT: ${{ runner.temp }}
        run: dotnet test DotnetNudge.sln --configuration Release --no-build
      - name: Plugin contracts
        run: python -m unittest discover -s tests/plugin-contracts -q
      - name: Offline approved trial fixtures
        if: runner.os != 'Windows'
        env:
          NUDGE_TEST_ROOT: ${{ runner.temp }}
        run: dotnet run --project tests/DotnetNudge.Trials.Tests/DotnetNudge.Trials.Tests.csproj --configuration Release
      - name: Publish self-contained
        run: dotnet publish src/DotnetNudge/DotnetNudge.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained true --output publish
      - name: Smoke
        shell: bash
        run: ./publish/${{ matrix.executable }} version
      - name: Verify published MCP protocol
        env:
          NUDGE_INTEGRATION_ENGINE_PATH: ${{ github.workspace }}/publish/${{ matrix.executable }}
          NUDGE_INTEGRATION_ENGINE_RID: ${{ matrix.rid }}
          NUDGE_INTEGRATION_TEST_ROOT: ${{ runner.temp }}
        run: dotnet test tests/DotnetNudge.Integration.Tests/DotnetNudge.Integration.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~ChildProcessInitializesListsToolsScansAndDecides|FullyQualifiedName~McpRefusesApprovalButExecutesHumanApprovedIsolatedTrial"
